<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070d">
<title>SYROX AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05070d;--panel:rgba(11,16,27,.96);--card:#0d1422;--text:#edf4ff;--muted:#91a0b7;--border:rgba(101,184,255,.18);--accent:#65b8ff;--user:#123c60}
body.light{--bg:#eef4fb;--panel:rgba(255,255,255,.97);--card:#fff;--text:#142235;--muted:#607187;--border:rgba(35,112,175,.18);--accent:#237dbb;--user:#dceeff}
html,body{height:100%;width:100%}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;width:100%;max-width:1320px;height:100dvh;margin:auto;border-inline:1px solid var(--border)}
.sidebar{width:265px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border)}
.side-head{padding:20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:11px}.logo,.hero-logo{display:grid;place-items:center;color:#07111d;font-weight:900;background:linear-gradient(135deg,#e8f7ff,#65b8ff 60%,#286b9e);box-shadow:0 0 24px #65b8ff35}
.logo{width:42px;height:42px;border-radius:13px;font-size:23px}.brand h1{font-size:17px;letter-spacing:1.8px}.brand h1 span{color:var(--accent)}.brand small{display:block;margin-top:5px;color:var(--muted);font-size:9px;letter-spacing:1px}
.icon-btn{width:39px;height:39px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:11px;font-size:17px;cursor:pointer}
.new-chat{margin:15px 13px 12px;padding:13px;border:1px solid #65b8ff55;border-radius:12px;color:#061321;background:linear-gradient(110deg,#a9ddff,#65b8ff);font-weight:bold;cursor:pointer}
.history-title{padding:13px 16px 8px;color:var(--muted);font-size:10px;font-weight:bold;letter-spacing:1.5px}#historyList{flex:1;overflow:auto;padding:0 9px 15px}
.history-item{display:flex;align-items:center;gap:9px;padding:12px 10px;margin-bottom:4px;border:1px solid transparent;border-radius:10px;cursor:pointer;color:var(--muted);font-size:12px}
.history-item:hover,.history-item.active{color:var(--text);background:var(--card);border-color:var(--border)}.history-title-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delete-chat{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}.side-bottom{padding:13px;border-top:1px solid var(--border)}.profile{display:flex;align-items:center;gap:10px;padding:8px}
.profile-avatar,.avatar{display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#d8f1ff,#397eac);color:#07111d;font-weight:900}.profile-avatar{width:35px;height:35px}.profile strong{font-size:12px}.profile small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}header{min-height:68px;padding:12px 17px;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--border)}
.header-left,.header-actions{display:flex;align-items:center;gap:9px}.header-status{font-size:10px;color:var(--muted);letter-spacing:.7px}.header-status i{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#55dc9b}.mobile-brand{display:none}
#messages{flex:1;overflow-y:auto;padding:25px 20px;scroll-behavior:smooth}
#welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px 0 35px}
.hero-logo{width:86px;height:86px;border-radius:25px;margin-bottom:23px;font-size:42px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}.welcome-badge{margin-bottom:17px;padding:7px 12px;border:1px solid var(--border);border-radius:30px;color:var(--accent);font-size:10px;letter-spacing:1.4px}
#welcome h2{font-size:clamp(28px,5vw,45px);margin-bottom:12px}.gradient-text{background:linear-gradient(90deg,#e8f7ff,#65b8ff,#a5dfff);-webkit-background-clip:text;background-clip:text;color:transparent}
#welcome p{max-width:390px;color:var(--muted);font-size:13px;line-height:1.8}.tagline{margin-top:10px;color:var(--accent);font-size:10px;letter-spacing:2px;font-weight:bold}
.suggestions{width:100%;max-width:650px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:28px}.suggestion{padding:15px;min-height:84px;text-align:left;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:14px;cursor:pointer}
.suggestion:hover{border-color:var(--accent);transform:translateY(-2px)}.suggestion-icon{display:block;margin-bottom:9px;color:var(--accent);font-size:19px}.suggestion strong{display:block;font-size:12px;margin-bottom:7px}.suggestion small{color:var(--muted);font-size:10px}
.message{display:flex;gap:11px;max-width:820px;margin:0 auto 22px}.message.user{flex-direction:row-reverse}.avatar{width:35px;height:35px;flex-shrink:0}.message.user .avatar{background:#245d86;color:white}
.bubble-wrap{min-width:0;flex:1}.message-name{color:var(--muted);font-size:10px;margin:4px 0 7px}.message.user .message-name{text-align:right}
.bubble{display:inline-block;max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13px;line-height:1.8;padding:12px 15px;background:var(--panel);border:1px solid var(--border);border-radius:4px 15px 15px 15px}
.message.user .bubble{background:var(--user);border-radius:15px 4px 15px 15px}
.typing-row{display:flex;gap:10px;align-items:center;margin:0 auto 20px;max-width:820px}.typing-dots{display:flex;gap:4px;padding:13px 15px;border:1px solid var(--border);background:var(--panel);border-radius:4px 14px 14px 14px}.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot 1s infinite}.typing-dots span:nth-child(2){animation-delay:.15s}.typing-dots span:nth-child(3){animation-delay:.3s}@keyframes dot{50%{transform:translateY(-5px);opacity:.4}}
.composer-area{padding:13px 16px 15px;border-top:1px solid var(--border);background:var(--panel)}.composer{display:flex;align-items:flex-end;gap:8px;max-width:870px;margin:auto;padding:8px;border:1px solid #65b8ff55;border-radius:17px;background:var(--card)}
#prompt{flex:1;min-width:0;max-height:140px;resize:none;outline:none;border:0;background:transparent;color:var(--text);font:13px Arial;line-height:1.6;padding:10px 5px}#prompt::placeholder{color:var(--muted)}
.send-btn{width:43px;height:43px;border:0;border-radius:12px;color:#07111d;background:linear-gradient(135deg,#dff5ff,#65b8ff);font-size:19px;font-weight:bold;cursor:pointer}.send-btn:disabled{opacity:.5}
.bottom-note{text-align:center;margin-top:10px;color:var(--muted);font-size:9px;letter-spacing:1px}#toast{position:fixed;left:50%;bottom:95px;z-index:10;transform:translateX(-50%);padding:11px 17px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:11px;font-size:12px;display:none}#toast.show{display:block}
.overlay{display:none}
@media(max-width:720px){.sidebar{position:fixed;z-index:5;left:0;top:0;bottom:0;width:min(285px,85vw);transform:translateX(-105%);transition:transform .25s}.sidebar.open{transform:translateX(0)}.side-close{display:block}.overlay{position:fixed;inset:0;z-index:4;background:#0008}.overlay.show{display:block}.mobile-brand{display:flex}.mobile-brand .logo{width:34px;height:34px;font-size:18px}.mobile-brand h1{font-size:13px}.header-status{display:none}header{padding:10px 11px;min-height:60px}.icon-btn{width:35px;height:35px}#messages{padding:19px 13px}.composer-area{padding:10px}.hero-logo{width:73px;height:73px;font-size:36px}#welcome h2{font-size:29px}.message{gap:8px}.avatar{width:31px;height:31px}.bubble{font-size:12px;padding:10px 12px}}
@media(max-width:360px){.suggestions{grid-template-columns:1fr}}
 /* SYROX AI — PREMIUM UI UPGRADE */

body {
  background-image:
    radial-gradient(ellipse at 15% 15%, #123b6328, transparent 45%),
    radial-gradient(ellipse at 85% 85%, #174b7820, transparent 45%);
  background-attachment: fixed;
}

.app {
  position: relative;
  isolation: isolate;
}

.sidebar,
header,
.composer-area {
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.logo,
.hero-logo {
  transition: transform .35s ease, box-shadow .35s ease;
}

.logo:hover,
.hero-logo:hover {
  transform: scale(1.07);
  box-shadow: 0 0 35px #65b8ff80;
}

.icon-btn,
.new-chat,
.send-btn,
.suggestion {
  transition: all .25s ease;
}

.icon-btn:hover,
.new-chat:hover,
.send-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 22px #65b8ff35;
}

.suggestion:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 28px #65b8ff20;
  border-color: #65b8ff90;
}

.message {
  animation: syroxMessage .35s ease both;
}

@keyframes syroxMessage {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-logo {
  animation: syroxGlow 3s ease-in-out infinite;
}

@keyframes syroxGlow {
  0%, 100% {
    box-shadow: 0 0 18px #65b8ff30;
  }
  50% {
    box-shadow: 0 0 38px #65b8ff75;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div><div id="toast"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="side-head"><div class="brand"><div class="logo">S</div><div><h1>SYROX <span>AI</span></h1><small>INTELLIGENCE BEYOND LIMITS</small></div></div><button class="icon-btn side-close" id="closeSidebar">✕</button></div>
 <button class="new-chat" id="newChatBtn">＋ New conversation</button><div class="history-title">YOUR CONVERSATIONS</div><div id="historyList"></div>
 <div class="side-bottom"><div class="profile"><div class="profile-avatar">S</div><div><strong>SYROX AI</strong><small>Personal AI assistant</small></div></div></div>
</aside>
<main class="main">
<header><div class="header-left"><button class="icon-btn" id="menuBtn">☰</button><div class="brand mobile-brand"><div class="logo">S</div><h1>SYROX <span>AI</span></h1></div><div class="header-status"><i></i> AI ASSISTANT ONLINE</div></div><div class="header-actions"><button class="icon-btn" id="themeBtn" title="Toggle theme">☼</button><button class="icon-btn" id="clearBtn" title="New conversation">＋</button></div></header>
<section id="messages"></section>
<div class="composer-area"><div class="composer"><button class="icon-btn" id="fileBtn" title="Attach text file">＋</button><textarea id="prompt" rows="1" placeholder="Message SYROX AI..."></textarea><button class="icon-btn" id="voiceBtn" title="Voice input">🎤</button><button class="send-btn" id="sendBtn">➤</button></div><input type="file" id="fileInput" accept=".txt,.md,.csv,.json" hidden><div class="bottom-note">BUILT FOR A SMARTER TOMORROW · SYROX AI v1.0</div></div>
</main></div>
<script>
const $=id=>document.getElementById(id),messages=$("messages"),promptBox=$("prompt"),sendBtn=$("sendBtn"),sidebar=$("sidebar"),overlay=$("overlay"),historyList=$("historyList");
const KEY="syrox_ai_chats",OLD_KEY="nexora_pro_chats",THEME="syrox_ai_theme";let conversations=[],activeChatId=null,sending=false,toastTimer;
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2300)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(conversations))}catch{toast("Storage is full; some history may not save.")}}
function current(){return conversations.find(c=>c.id===activeChatId)}
function createChat(render=true){const c={id:id(),title:"New conversation",messages:[],updatedAt:Date.now()};conversations.unshift(c);activeChatId=c.id;save();if(render){renderHistory();renderMessages();closeSidebar();promptBox.value="";promptBox.focus()}return c}
function load(){try{let s=localStorage.getItem(KEY);if(!s){s=localStorage.getItem(OLD_KEY);if(s)localStorage.setItem(KEY,s)}conversations=JSON.parse(s||"[]");if(!Array.isArray(conversations))conversations=[]}catch{conversations=[]}conversations=conversations.filter(c=>c&&typeof c.id==="string"&&Array.isArray(c.messages));if(conversations.length)activeChatId=conversations[0].id;else createChat(false)}
function renderHistory(){historyList.innerHTML="";if(!conversations.length){historyList.textContent="No conversations yet";return}conversations.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).forEach(c=>{const row=document.createElement("div");row.className="history-item"+(c.id===activeChatId?" active":"");const title=document.createElement("span");title.className="history-title-text";title.textContent="◈ "+(c.title||"New conversation");const del=document.createElement("button");del.className="delete-chat";del.textContent="×";del.title="Delete";del.onclick=e=>{e.stopPropagation();conversations=conversations.filter(x=>x.id!==c.id);if(activeChatId===c.id)activeChatId=conversations[0]?.id||null;if(!activeChatId)createChat(false);save();renderHistory();renderMessages()};row.append(title,del);row.onclick=()=>{activeChatId=c.id;renderHistory();renderMessages();closeSidebar()};historyList.appendChild(row)})}
function welcome(){messages.innerHTML=`<section id="welcome"><div class="welcome-badge">✦ YOUR PERSONAL AI</div><div class="hero-logo">S</div><h2>Welcome to <span class="gradient-text">SYROX</span></h2><p>Your ideas, questions and creativity — all in one place. What shall we explore today?</p><div class="tagline">INTELLIGENCE BEYOND LIMITS</div><div class="suggestions"><button class="suggestion" data-p="Teach me Python programming from the basics"><span class="suggestion-icon">⌘</span><strong>Learn Coding</strong><small>Learn Python step by step</small></button><button class="suggestion" data-p="Give me creative ideas for a new project"><span class="suggestion-icon">✧</span><strong>Creative Ideas</strong><small>Turn ideas into something great</small></button><button class="suggestion" data-p="Explain cybersecurity for beginners"><span class="suggestion-icon">⌁</span><strong>Cybersecurity</strong><small>Explore digital security</small></button><button class="suggestion" data-p="Help me create a daily study plan"><span class="suggestion-icon">◷</span><strong>Study Planner</strong><small>Plan a productive day</small></button></div></section>`;messages.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{promptBox.value=b.dataset.p;sendMessage()})}
function add(role,text,store=true){const row=document.createElement("div");row.className="message "+(role==="user"?"user":"assistant");const av=document.createElement("div");av.className="avatar";av.textContent=role==="user"?"Y":"S";const wrap=document.createElement("div");wrap.className="bubble-wrap";const name=document.createElement("div");name.className="message-name";name.textContent=role==="user"?"You":"SYROX AI";const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;wrap.append(name,bubble);row.append(av,wrap);messages.appendChild(row);if(store){const c=current();if(c){c.messages.push({role,text});c.updatedAt=Date.now();if(c.title==="New conversation"&&role==="user")c.title=text.slice(0,35)+(text.length>35?"…":"");save();renderHistory()}}messages.scrollTop=messages.scrollHeight}
function renderMessages(){messages.innerHTML="";const c=current();if(!c||!c.messages.length){welcome();return}c.messages.forEach(m=>{if(m&&(m.role==="user"||m.role==="assistant"))add(m.role,String(m.text||""),false)})}
function closeSidebar(){sidebar.classList.remove("open");overlay.classList.remove("show")}
async function sendMessage(){const text=promptBox.value.trim();if(!text||sending)return;if(!current())createChat(false);sending=true;sendBtn.disabled=true;promptBox.value="";promptBox.style.height="auto";const chatId=activeChatId;add("user",text);const typing=document.createElement("div");typing.className="typing-row";typing.id="typing";typing.innerHTML='<div class="avatar">S</div><div class="typing-dots"><span></span><span></span><span></span></div>';messages.appendChild(typing);messages.scrollTop=messages.scrollHeight;try{const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.error||"AI request failed");if(!data.reply)throw Error("Empty AI response");$("typing")?.remove();if(activeChatId===chatId)add("assistant",data.reply);else{const c=conversations.find(x=>x.id===chatId);if(c){c.messages.push({role:"assistant",text:data.reply});c.updatedAt=Date.now();save();renderHistory()}}}catch(e){$("typing")?.remove();if(activeChatId===chatId)add("assistant","Sorry, "+(e.message||"Could not connect")+". Check the Render server and GROQ_API_KEY.");else toast(e.message)}finally{sending=false;sendBtn.disabled=false;promptBox.focus()}}
$("sendBtn").onclick=sendMessage;promptBox.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};promptBox.oninput=()=>{promptBox.style.height="auto";promptBox.style.height=Math.min(promptBox.scrollHeight,140)+"px"};
$("newChatBtn").onclick=()=>createChat(true);$("clearBtn").onclick=()=>createChat(true);$("menuBtn").onclick=()=>{sidebar.classList.add("open");overlay.classList.add("show")};$("closeSidebar").onclick=closeSidebar;overlay.onclick=closeSidebar;
$("themeBtn").onclick=()=>{document.body.classList.toggle("light");localStorage.setItem(THEME,document.body.classList.contains("light")?"light":"dark")};
$("fileBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>50000){toast("Choose a text file under 50 KB");e.target.value="";return}promptBox.value+=(promptBox.value?"\n":"")+"File: "+f.name+"\n"+await f.text();promptBox.focus();e.target.value=""};
$("voiceBtn").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("Voice input is not supported in this browser");return}const rec=new SR();rec.lang="en-IN";rec.onresult=e=>{promptBox.value+=(promptBox.value?" ":"")+e.results[0][0].transcript};rec.onerror=()=>toast("Voice input was not completed");rec.start()};
try{const t=localStorage.getItem(THEME)||localStorage.getItem("nexora_pro_theme");if(t==="light")document.body.classList.add("light")}catch{}
load();renderHistory();renderMessages();
</script>
</body></html>
