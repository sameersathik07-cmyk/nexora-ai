<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090711">
<title>NEXORA AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #090711;
  --panel: rgba(20, 16, 34, 0.88);
  --card: #171326;
  --text: #f8f6ff;
  --muted: #a7a0bc;
  --border: rgba(174, 119, 255, 0.18);
  --accent: #a855f7;
  --accent2: #6d28d9;
  --user: #5423a6;
}

body.light {
  --bg: #f7f4ff;
  --panel: rgba(255, 255, 255, 0.94);
  --card: #ffffff;
  --text: #201533;
  --muted: #766b88;
  --border: rgba(109, 40, 217, 0.18);
  --accent: #7c3aed;
  --accent2: #6d28d9;
  --user: #7c3aed;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow: hidden;
  transition: background .3s, color .3s;
}

body::before {
  content: "";
  position: fixed;
  width: 280px;
  height: 280px;
  top: -100px;
  left: -90px;
  border-radius: 50%;
  background: #7c3aed;
  filter: blur(130px);
  opacity: .24;
  pointer-events: none;
}

body::after {
  content: "";
  position: fixed;
  width: 250px;
  height: 250px;
  bottom: -100px;
  right: -70px;
  border-radius: 50%;
  background: #c026d3;
  filter: blur(130px);
  opacity: .18;
  pointer-events: none;
}

.app {
  width: 100%;
  max-width: 1000px;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  background: rgba(10, 8, 18, .25);
}

header {
  min-height: 70px;
  padding: 12px 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(20px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.logo {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 15px;
  font-size: 23px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg, #c084fc, #7c3aed 55%, #4c1d95);
  box-shadow: 0 0 24px rgba(168, 85, 247, .42);
}

.brand h1 {
  font-size: 19px;
  letter-spacing: 2px;
}

.brand h1 span {
  color: #c084fc;
}

.status {
  font-size: 11px;
  margin-top: 5px;
  color: var(--muted);
}

.status i {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #4ade80;
  border-radius: 50%;
  margin-right: 5px;
  box-shadow: 0 0 8px #4ade80;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 13px;
  font-size: 18px;
  cursor: pointer;
  transition: .2s;
}

.icon-btn:hover {
  border-color: var(--accent);
  box-shadow: 0 0 14px rgba(168, 85, 247, .22);
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px 16px;
  scroll-behavior: smooth;
}

#messages::-webkit-scrollbar {
  width: 5px;
}

#messages::-webkit-scrollbar-thumb {
  background: #61349b;
  border-radius: 10px;
}

#welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px 0 45px;
  animation: appear .6s ease;
}

.hero-logo {
  width: 78px;
  height: 78px;
  display: grid;
  place-items: center;
  border-radius: 26px;
  font-size: 40px;
  font-weight: bold;
  color: white;
  background: linear-gradient(140deg, #d8b4fe, #9333ea, #4c1d95);
  box-shadow: 0 0 22px #9333ea66, 0 0 65px #7c3aed33;
  margin-bottom: 25px;
  animation: float 3s ease-in-out infinite;
}

#welcome h2 {
  font-size: clamp(27px, 6vw, 43px);
  line-height: 1.2;
  margin-bottom: 12px;
}

#welcome h2 span {
  background: linear-gradient(90deg, #e9d5ff, #c084fc, #9333ea);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

#welcome p {
  max-width: 350px;
  line-height: 1.7;
  font-size: 14px;
  color: var(--muted);
}

.suggestions {
  width: 100%;
  max-width: 610px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
  margin-top: 30px;
}

.suggestion {
  padding: 15px;
  min-height: 86px;
  text-align: left;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 17px;
  cursor: pointer;
  transition: .25s;
}

.suggestion:hover {
  transform: translateY(-3px);
  border-color: #a855f7;
  box-shadow: 0 0 20px #9333ea20;
}

.suggestion strong {
  display: block;
  font-size: 13px;
  margin-bottom: 8px;
}

.suggestion small {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.message {
  display: flex;
  gap: 10px;
  margin: 0 auto 22px;
  max-width: 720px;
  animation: appear .25s ease;
}

.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-size: 15px;
  background: linear-gradient(135deg, #9333ea, #4c1d95);
  color: white;
}

.message.user .avatar {
  background: #302542;
}

.bubble-wrap {
  min-width: 0;
  flex: 1;
}

.message-name {
  font-size: 11px;
  color: var(--muted);
  margin: 3px 0 8px;
}

.bubble {
  display: inline-block;
  max-width: 100%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.75;
  padding: 12px 15px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 4px 17px 17px 17px;
}

.message.user .bubble {
  background: linear-gradient(135deg, #6028aa, #452080);
  color: white;
  border-color: #a855f744;
  border-radius: 17px 4px 17px 17px;
}

.message.user {
  flex-direction: row-reverse;
}

.message.user .message-name {
  text-align: right;
}

.composer-area {
  padding: 12px 15px 16px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(20px);
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  max-width: 760px;
  margin: auto;
  padding: 9px;
  border: 1px solid #8b5cf655;
  border-radius: 20px;
  background: var(--card);
  box-shadow: 0 0 25px #9333ea10;
  transition: .25s;
}

.composer:focus-within {
  border-color: #a855f7;
  box-shadow: 0 0 20px #9333ea22;
}

#prompt {
  flex: 1;
  min-width: 0;
  max-height: 130px;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  padding: 10px 5px;
}

#prompt::placeholder {
  color: var(--muted);
}

.send-btn {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #c084fc, #7c3aed);
  color: white;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 0 15px #9333ea40;
  transition: .2s;
}

.send-btn:hover {
  transform: scale(1.05);
}

.send-btn:disabled {
  opacity: .5;
  cursor: wait;
}

.bottom-note {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  margin-top: 10px;
}

.typing {
  color: var(--muted);
  font-size: 13px;
  padding: 10px 0;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (min-width: 700px) {
  #messages { padding: 28px 30px; }
  header { padding: 14px 25px; }
  .composer-area { padding: 16px 25px 20px; }
}

@media (max-width: 420px) {
  header { padding: 10px 11px; }
  .brand h1 { font-size: 16px; letter-spacing: 1.5px; }
  .logo { width: 39px; height: 39px; }
  .header-actions { gap: 5px; }
  .icon-btn { width: 35px; height: 35px; font-size: 16px; }
  .suggestions { gap: 8px; }
  .suggestion { padding: 12px; min-height: 80px; }
  .suggestion strong { font-size: 12px; }
  .suggestion small { font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">N</div>
    <div>
      <h1>NEXORA <span>AI</span></h1>
      <div class="status"><i></i> AI ASSISTANT</div>
    </div>
  </div>

  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" title="Change theme">☼</button>
    <button class="icon-btn" id="newBtn" title="New chat">＋</button>
  </div>
</header>

<main id="messages">
  <section id="welcome">
    <div class="hero-logo">N</div>
    <h2>Welcome to <span>NEXORA</span></h2>
    <p>Your ideas, questions and creativity — all in one place. What shall we explore today?</p>

    <div class="suggestions">
      <button class="suggestion" data-prompt="Teach me Python programming from the basics">
        <strong>⌘ Learn Coding</strong>
        <small>Learn Python step by step</small>
      </button>

      <button class="suggestion" data-prompt="Give me creative ideas for a new project">
        <strong>✧ Creative Ideas</strong>
        <small>Turn ideas into something great</small>
      </button>

      <button class="suggestion" data-prompt="Explain cybersecurity for beginners">
        <strong>⌁ Cybersecurity</strong>
        <small>Explore the world of security</small>
      </button>

      <button class="suggestion" data-prompt="Help me create a daily study plan">
        <strong>◷ Study Planner</strong>
        <small>Make your day more productive</small>
      </button>
    </div>
  </section>
</main>

<div class="composer-area">
  <div class="composer">
    <button class="icon-btn" id="fileBtn" title="Choose file">＋</button>

    <textarea id="prompt" rows="1" placeholder="Message NEXORA AI..."></textarea>

    <button class="icon-btn" id="voiceBtn" title="Voice input">🎤</button>

    <button class="send-btn" id="sendBtn" title="Send message">➤</button>
  </div>

  <input type="file" id="fileInput" hidden>

  <div class="bottom-note">
    NEXORA AI · Built for ideas, powered by AI
  </div>
</div>

</div>

<script>
const messages = document.getElementById("messages");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const welcome = document.getElementById("welcome");
const historyKey = "nexora_history";

let chatHistory = [];

try {
  chatHistory = JSON.parse(localStorage.getItem(historyKey) || "[]");
  if (!Array.isArray(chatHistory)) chatHistory = [];
} catch {
  chatHistory = [];
}

function saveHistory() {
  try {
    localStorage.setItem(historyKey, JSON.stringify(chatHistory));
  } catch (e) {
    console.log("Could not save chat history.");
  }
}

function addMessage(role, text, save = true) {
  if (welcome) welcome.remove();

  const row = document.createElement("div");
  row.className = "message " + (role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "Y" : "N";

  const wrap = document.createElement("div");
  wrap.className = "bubble-wrap";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = role === "user" ? "You" : "NEXORA AI";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  wrap.appendChild(name);
  wrap.appendChild(bubble);
  row.appendChild(avatar);
  row.appendChild(wrap);
  messages.appendChild(row);

  messages.scrollTop = messages.scrollHeight;

  if (save) {
    chatHistory.push({ role, text });
    saveHistory();
  }

  return row;
}

function showWelcome() {
  messages.innerHTML = `
    <section id="welcome">
      <div class="hero-logo">N</div>
      <h2>Welcome to <span>NEXORA</span></h2>
      <p>Your ideas, questions and creativity — all in one place. What shall we explore today?</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Teach me Python programming from the basics">
          <strong>⌘ Learn Coding</strong>
          <small>Learn Python step by step</small>
        </button>
        <button class="suggestion" data-prompt="Give me creative ideas for a new project">
          <strong>✧ Creative Ideas</strong>
          <small>Turn ideas into something great</small>
        </button>
        <button class="suggestion" data-prompt="Explain cybersecurity for beginners">
          <strong>⌁ Cybersecurity</strong>
          <small>Explore the world of security</small>
        </button>
        <button class="suggestion" data-prompt="Help me create a daily study plan">
          <strong>◷ Study Planner</strong>
          <small>Make your day more productive</small>
        </button>
      </div>
    </section>`;
}

async function sendMessage(text) {
  text = text.trim();
  if (!text || sendBtn.disabled) return;

  addMessage("user", text);
  promptBox.value = "";
  promptBox.style.height = "auto";
  sendBtn.disabled = true;

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "NEXORA AI is thinking...";
  messages.appendChild(typing);
  messages.scrollTop = messages.scrollHeight;

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed.");
    }

    typing.remove();
    addMessage("assistant", data.reply || "I couldn't generate a reply.");
  } catch (error) {
    typing.remove();
    addMessage(
      "assistant",
      "Sorry, I couldn't connect to the AI right now. Please check your internet and try again."
    );
    console.error(error);
  } finally {
    sendBtn.disabled = false;
    promptBox.focus();
  }
}

sendBtn.addEventListener("click", () => sendMessage(promptBox.value));

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage(promptBox.value);
  }
});

promptBox.addEventListener("input", () => {
  promptBox.style.height = "auto";
  promptBox.style.height = Math.min(promptBox.scrollHeight, 130) + "px";
});

document.addEventListener("click", event => {
  const card = event.target.closest("[data-prompt]");
  if (card) {
    sendMessage(card.dataset.prompt);
  }
});

document.getElementById("newBtn").addEventListener("click", () => {
  chatHistory = [];
  saveHistory();
  showWelcome();
  promptBox.value = "";
});

document.getElementById("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("light");
  localStorage.setItem(
    "nexora_theme",
    document.body.classList.contains("light") ? "light" : "dark"
  );
});

if (localStorage.getItem("nexora_theme") === "light") {
  document.body.classList.add("light");
}

document.getElementById("fileBtn").addEventListener("click", () => {
  document.getElementById("fileInput").click();
});

document.getElementById("fileInput").addEventListener("change", event => {
  const file = event.target.files[0];
  if (file) {
    promptBox.value = "I selected the file: " + file.name +
      ". Can you help me with it?";
    promptBox.focus();
  }
});

document.getElementById("voiceBtn").addEventListener("click", () => {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser. Try Chrome.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ta-IN";
  recognition.interimResults = false;

  recognition.onresult = event => {
    promptBox.value = event.results[0][0].transcript;
    promptBox.dispatchEvent(new Event("input"));
  };

  recognition.onerror = () => {
    alert("Voice input failed. Please try again.");
  };

  recognition.start();
});

// Restore the current browser's saved conversation.
chatHistory.forEach(item => {
  if (item && (item.role === "user" || item.role === "assistant")) {
    addMessage(item.role, String(item.text || ""), false);
  }
});
</script>

</body>
</html>
